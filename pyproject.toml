[project]
name = "new-fastapi"
version = "0.1.0"
description = "API для получения форм Росстата по ИНН"
authors = [
    {name = "Damian"}
]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.142.2,<0.143.0)",
    "playwright (>=1.63.0,<2.0.0)",
    "pydantic (>=2.13.5,<3.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "bs4 (>=0.0.2,<0.0.3)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]



[tool.ruff]

exclude = [
    ".venv",
    ".git",
    ".gitignore",
    "__pycache__",
]

select = [
    "E",
    "F",
    "UP",
    "N",
    "B",
    "C4",
    "RUF",
    "ANN",
]

ignore = [
    "E501",
    "B008",
    "B904",
    "RUF001",
    "RUF002",
    "B905",
    "ANN101",
    "ANN102",
    "ANN204",
    "ANN401",
]

line-length = 88
target-version = "py310"

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true
suppress-dummy-args = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-v"